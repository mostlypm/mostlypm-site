<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 288' role='img' aria-label='Phase 2: the POC loop, user check and Product Blueprint' font-family="'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13'><rect width='760' height='288' fill='#FFFFFF'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ADA8CC'/></marker></defs><text x='24' y='26' font-size='15' font-weight='600' fill='#1B1838'>The POC answers one question first: is the AI good enough?</text><path d='M200 120H223' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M400 120H423' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M536 120H559' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M480 84V60H112V95' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M312 144V215' fill='none' stroke='#ADA8CC' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#arrow)'/><path d='M400 240H559' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M648 144V215' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='96' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='112' y='124' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Core AI flow POC</text><rect x='224' y='96' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='312' y='124' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Run 20–50 inputs</text><polygon points='424,120 480,84 536,120 480,156' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='480' y='124' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Good enough?</text><rect x='560' y='96' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='648' y='124' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Check with 3–5 users</text><rect x='224' y='216' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='312' y='244' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Golden dataset</text><rect x='560' y='216' width='176' height='48' rx='8' fill='#ECE9FF' stroke='#4B3FC7' stroke-width='2'/><text x='648' y='244' text-anchor='middle' font-size='13' font-weight='600' fill='#1B1838'>Product Blueprint</text><text x='548' y='112' text-anchor='middle' font-size='11.5' font-weight='400' fill='#57527A'>yes</text><text x='296' y='52' text-anchor='middle' font-size='11.5' font-weight='400' fill='#57527A'>no: adjust prompt, data or scope</text><text x='322' y='184' text-anchor='start' font-size='11.5' font-weight='400' fill='#57527A'>every interesting case</text><text x='480' y='230' text-anchor='middle' font-size='11.5' font-weight='400' fill='#57527A'>feeds How we'll know</text></svg>
