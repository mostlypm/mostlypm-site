<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 272' role='img' aria-label='Phase 3: the eval loop' font-family="'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13'><rect width='760' height='272' fill='#FFFFFF'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ADA8CC'/></marker></defs><text x='24' y='34' font-size='15' font-weight='600' fill='#1B1838'>Every change re-runs the same golden dataset against the same bar</text><path d='M200 100H223' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M400 100H423' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M512 124V195' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M424 220H401' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M312 196V125' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M112 196V125' fill='none' stroke='#ADA8CC' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='76' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='112' y='104' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Golden dataset</text><rect x='224' y='76' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='312' y='104' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>AI feature</text><rect x='424' y='76' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='512' y='104' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Score against metrics</text><rect x='24' y='196' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='112' y='224' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>User validation</text><rect x='224' y='196' width='176' height='48' rx='8' fill='none' stroke='#ADA8CC' stroke-width='1.25'/><text x='312' y='224' text-anchor='middle' font-size='13' font-weight='400' fill='#1B1838'>Fix prompt or data</text><rect x='424' y='196' width='176' height='48' rx='8' fill='#ECE9FF' stroke='#4B3FC7' stroke-width='2'/><text x='512' y='224' text-anchor='middle' font-size='13' font-weight='600' fill='#1B1838'>Baseline report</text><text x='322' y='164' text-anchor='start' font-size='11.5' font-weight='400' fill='#57527A'>rerun</text><text x='122' y='164' text-anchor='start' font-size='11.5' font-weight='400' fill='#57527A'>new failures become cases</text><text x='616' y='216' text-anchor='start' font-size='11.5' font-weight='400' fill='#57527A'>below the bar: fix</text><text x='616' y='232' text-anchor='start' font-size='11.5' font-weight='400' fill='#57527A'>clears it: ready to ship</text></svg>
